<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Christian — Senior Software Engineer · Full-Stack &amp; AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="60%" stop-color="#111530"/>
      <stop offset="100%" stop-color="#0b1a2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      .name { font: 800 76px 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; letter-spacing: -1.5px; }
      .role { font: 600 26px 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font: 500 16px 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace; letter-spacing: 1px; }
      .fade { opacity: 0; animation: in 0.9s ease-out forwards; }
      .d1 { animation-delay: 0.15s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.55s; }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .float { animation: float 9s ease-in-out infinite alternate; }
      .float2 { animation: float 11s ease-in-out infinite alternate-reverse; }
      @keyframes float { from { transform: translate(0, 0); } to { transform: translate(-40px, 20px); } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle class="float" cx="980" cy="60" r="260" fill="url(#glowA)"/>
    <circle class="float2" cx="1120" cy="280" r="220" fill="url(#glowB)"/>

    <!-- decorative code glyph -->
    <g transform="translate(905 92)" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M60 18 L10 58 L60 98"/>
      <path d="M200 18 L250 58 L200 98"/>
      <path d="M150 0 L110 116"/>
    </g>

    <g transform="translate(80 0)">
      <text class="mono fade" x="0" y="96" fill="#818cf8">~/christian <tspan fill="#64748b">$</tspan> whoami</text>
      <text class="name fade d1" x="-3" y="170" fill="#f8fafc">Christian</text>
      <text class="role fade d2" x="0" y="214" fill="url(#accent)">Senior Software Engineer · Full-Stack &amp; AI</text>
      <text class="mono fade d3" x="0" y="252" fill="#94a3b8">10+ YEARS  ·  WEB PLATFORMS  ·  LLMs  ·  AGENTS<tspan class="blink" fill="#22d3ee"> _</tspan></text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
